# Cloud Run deployment settings for Order Service (ADR-008).
HEALTH_PATH=/actuator/health
EXTRA_FLAGS=(
  --memory=768Mi --cpu=1 --cpu-boost
  --execution-environment=gen2
  --min-instances=0 --max-instances=3
  --add-cloudsql-instances="${ORDER_DB_INSTANCE_CONNECTION_NAME}"
  --set-secrets="SPRING_DATASOURCE_PASSWORD=${ORDER_DB_PASSWORD_SECRET}:latest"
)
# Internal ingress (deploy.sh default). It calls the User, Supplier and Credit services, which are
# internal too, so all its traffic goes through the VPC: Google APIs via Private Google Access, the
# internet (Cloud SQL's public IP) via Cloud NAT.
VPC_EGRESS=all-traffic
