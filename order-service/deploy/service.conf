# Sourced by scripts/ci/deploy.sh. Override per staging/production environment.
HEALTH_PATH=/actuator/health/readiness
ORDER_DB_PASSWORD_SECRET=${ORDER_DB_PASSWORD_SECRET:-REPLACE_ME_SECRET_NAME}
if grep -q 'REPLACE_ME' order-service/deploy/env.yaml || [[ "$ORDER_DB_PASSWORD_SECRET" == REPLACE_ME* ]]; then
  echo 'Order deployment is not configured: replace deploy/env.yaml placeholders and set ORDER_DB_PASSWORD_SECRET.' >&2
  return 1
fi
EXTRA_FLAGS=(
  --memory=768Mi --cpu=1 --cpu-boost
  --min-instances=0 --max-instances=3
  --set-secrets="DB_PASSWORD=${ORDER_DB_PASSWORD_SECRET}:latest"
  --startup-probe="httpGet.path=/actuator/health/readiness,initialDelaySeconds=5,periodSeconds=5,failureThreshold=24,timeoutSeconds=3"
)
