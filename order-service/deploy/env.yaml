# Order Service Cloud Run environment (ADR-008).
# Values are substituted from infra/environments/<env>.env by scripts/ci/deploy.sh.
# The database password is injected from Secret Manager by service.conf.
SPRING_DATASOURCE_URL: "jdbc:postgresql:///${ORDER_DB_NAME}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${ORDER_DB_INSTANCE_CONNECTION_NAME}&cloudSqlRefreshStrategy=lazy"
SPRING_DATASOURCE_USERNAME: "${ORDER_DB_USERNAME}"
SPRING_PROFILES_ACTIVE: "prod"
FOC_ENVIRONMENT: "${ENVIRONMENT}"
ORDER_MESSAGING_MODE: "cloud"
ORDER_LIFECYCLE_EXTERNAL_ENABLED: "false"
ORDER_PEERS_MODE: "${ORDER_PEERS_MODE}"
FOC_INTERNAL_ORDER_API_ENABLED: "true"
ORDER_AUTO_REPOST_ENABLED: "true"
ORDER_COMMAND_RECOVERY_POLICY: "compensate"
ORDER_COMPENSATION_ENABLED: "true"
ORDER_COMPENSATION_REQUEST_TOPIC: "${ORDER_CREDIT_COMPENSATION_TOPIC}"
ORDER_COMPENSATION_RESULT_SUBSCRIPTION: "${ORDER_COMPENSATION_RESULT_SUBSCRIPTION}"
ORDER_COMPENSATION_PUSH_MODE: "google"
ORDER_COMPENSATION_PUSH_AUDIENCE: "${ORDER_SERVICE_URL}"
ORDER_COMPENSATION_PUSH_SERVICE_ACCOUNT: "${ORDER_COMPENSATION_PUSH_SERVICE_ACCOUNT}"
USER_SERVICE_URL: "${USER_SERVICE_URL}"
SUPPLIER_SERVICE_URL: "${SUPPLIER_SERVICE_URL}"
CREDIT_SERVICE_URL: "${CREDIT_SERVICE_URL}"
ORDER_DB_INSTANCE_CONNECTION_NAME: "${ORDER_DB_INSTANCE_CONNECTION_NAME}"
ORDER_DB_NAME: "${ORDER_DB_NAME}"
PUBSUB_PROJECT_ID: "protean-vigil-509704-q4"
ORDER_COMPLETION_TOPIC: "${ORDER_COMPLETION_TOPIC}"
ORDER_OPEN_REFUND_TOPIC: "${ORDER_OPEN_REFUND_TOPIC}"
ORDER_COURIER_PENALTY_ADDITION_TOPIC: "${ORDER_COURIER_PENALTY_ADDITION_TOPIC}"
ORDER_COURIER_PENALTY_DEDUCTION_TOPIC: "${ORDER_COURIER_PENALTY_DEDUCTION_TOPIC}"
ORDER_LIFECYCLE_CRON: "${ORDER_LIFECYCLE_CRON}"
ORDER_OUTBOX_RECOVERY_CRON: "${ORDER_OUTBOX_RECOVERY_CRON}"

# Report coordinator is opt-in; deployment always supplies explicit cloud identities.
ORDER_REPORT_RESOLUTION_ENABLED: "${ORDER_REPORT_RESOLUTION_ENABLED}"
REPORT_SERVICE_URL: "${REPORTING_SERVICE_URL}"
ORDER_REPORT_RESOLUTION_TIMEOUT: "${ORDER_REPORT_RESOLUTION_TIMEOUT}"
ORDER_REPORT_COMPENSATION_TOPIC: "${ORDER_REPORT_COMPENSATION_TOPIC}"
REPORT_COMPENSATION_RESULT_TOPIC: "${REPORT_COMPENSATION_RESULT_TOPIC}"
ORDER_REPORT_COMPENSATION_RESULT_SUBSCRIPTION: "${ORDER_REPORT_COMPENSATION_RESULT_SUBSCRIPTION}"
ORDER_REPORT_COMPENSATION_PUSH_MODE: "google"
ORDER_REPORT_COMPENSATION_PUSH_AUDIENCE: "${ORDER_SERVICE_URL}"
ORDER_REPORT_COMPENSATION_PUSH_SERVICE_ACCOUNT: "${ORDER_REPORT_COMPENSATION_PUSH_SERVICE_ACCOUNT}"
