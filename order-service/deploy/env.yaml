# Order Service Cloud Run environment (ADR-008).
# Values are substituted from infra/environments/<env>.env by scripts/ci/deploy.sh.
# The database password is injected from Secret Manager by service.conf.
SPRING_DATASOURCE_URL: "jdbc:postgresql:///${ORDER_DB_NAME}?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${ORDER_DB_INSTANCE_CONNECTION_NAME}&cloudSqlRefreshStrategy=lazy"
SPRING_DATASOURCE_USERNAME: "${ORDER_DB_USERNAME}"
SPRING_PROFILES_ACTIVE: "prod"
ORDER_PEERS_MODE: "${ORDER_PEERS_MODE}"
USER_SERVICE_URL: "${USER_SERVICE_URL}"
SUPPLIER_SERVICE_URL: "${SUPPLIER_SERVICE_URL}"
CREDIT_SERVICE_URL: "${CREDIT_SERVICE_URL}"
ORDER_DB_INSTANCE_CONNECTION_NAME: "${ORDER_DB_INSTANCE_CONNECTION_NAME}"
ORDER_DB_NAME: "${ORDER_DB_NAME}"
