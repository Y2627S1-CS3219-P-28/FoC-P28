# Public tunnel origin: no gateway, health, database or general Credit exposure.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    log_format push '$request_method $uri $status';
    access_log /dev/stdout push;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        location ~ ^/api/credits/internal/order-events/(open-refund|accepted-cancellation|completion)$ {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            set $credit_upstream http://credit-service:8080;
            proxy_pass $credit_upstream;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_next_upstream off;
            proxy_redirect off;
        }
        location / { return 404; }
    }
    # Only the container healthcheck uses this; cloudflared targets port 8080.
    server {
        listen 8081;
        server_name _;
        access_log off;
        location = /health { return 200 'ok'; }
        location / { return 404; }
    }
}
