spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 10000

  flyway:
    enabled: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      # Checks that the database matches the entities without changing tables.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    path: /api/orders/v3/api-docs
  swagger-ui:
    path: /api/orders/docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    sg.edu.nus.foc.order: ${ORDER_SERVICE_LOG_LEVEL:INFO}
