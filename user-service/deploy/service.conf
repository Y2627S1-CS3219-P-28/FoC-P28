# Sourced by scripts/ci/deploy.sh (bash) with the environment's variables exported.
# See docs/ci-cd.md "Per-service deploy config".
HEALTH_PATH=/actuator/health
EXTRA_FLAGS=(
  # MongoDB Atlas connection string (contains credentials), one Secret Manager secret per environment.
  --set-secrets="MONGODB_URI=${USER_MONGODB_URI_SECRET}:latest"
)
# Internal ingress (deploy.sh default); Pub/Sub push from this project still reaches it. It calls the
# User Service for roles, which is internal too, so all its traffic goes through the VPC: Google APIs
# via Private Google Access, the internet (Cloud SQL's public IP) via Cloud NAT.
VPC_EGRESS=all-traffic
