# Scope: Generated Spring Boot runtime configuration for the team-finalized Credit Service settings.
# Author review: I reviewed for correctness.

spring:
  application:
    name: credit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/credit_service}
    username: ${SPRING_DATASOURCE_USERNAME:credit_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:credit_dev_password}
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

foc:
  credit:
    auth:
      project-id: ${FIREBASE_AUTH_PROJECT_ID:demo-foc}
      emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
    cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/credits/v3/api-docs
  swagger-ui:
    path: /api/credits/docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}
