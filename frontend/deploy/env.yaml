# Cloud Run env vars, rendered with envsubst by scripts/ci/deploy.sh from
# infra/environments/<environment>.env. Read at request time by src/lib/runtime-config.ts.
FOC_ENVIRONMENT: "${ENVIRONMENT}"
# Empty = same origin: the browser reaches the UI and the APIs through the gateway.
FOC_API_BASE_URL: ""
# Direct visits to the frontend's own URL are redirected here (src/proxy.ts).
FOC_PUBLIC_URL: "${GATEWAY_URL}"
FOC_FIREBASE_PROJECT_ID: "${FIREBASE_AUTH_PROJECT_ID}"
FOC_FIREBASE_AUTH_DOMAIN: "${FIREBASE_AUTH_DOMAIN}"
FOC_FIREBASE_API_KEY: "${FIREBASE_WEB_API_KEY}"
FOC_FIREBASE_APP_ID: "${FIREBASE_APP_ID}"
