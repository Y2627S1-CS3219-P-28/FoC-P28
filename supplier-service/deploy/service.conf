# Sourced by scripts/ci/deploy.sh (bash) with the environment's variables exported.
# See docs/ci-cd.md "Per-service deploy config".
HEALTH_PATH=/actuator/health
EXTRA_FLAGS=(
  --memory=768Mi --cpu=1 --cpu-boost
  # Cloud Storage volume mounts need the second-generation execution environment.
  --execution-environment=gen2
  --min-instances=0 --max-instances=3
  # Seed CSV from the environment's config bucket, mounted read-only (F2.1.1).
  --add-volume="name=config,type=cloud-storage,bucket=${PROJECT_ID}-foc-config-${ENVIRONMENT},readonly=true"
  --add-volume-mount="volume=config,mount-path=/config"
  # The seed load runs before the server starts, so readiness also means "catalogue loaded" (F2.2.1).
  --startup-probe="httpGet.path=/actuator/health/readiness,initialDelaySeconds=5,periodSeconds=5,failureThreshold=24,timeoutSeconds=3"
)
