# AI Assistance Disclosure:
# Tool: OpenAI Codex (GPT-5), date: 2026-09-25
# Scope: Updated deployment boilerplate to integrate the Credit Service.
# Author review: I reviewed for correctness.

# FoC local deployment (M7). Start everything with:   docker compose up --build
#
#   http://localhost:8080   gateway: UI + all APIs (use this one)
#   http://localhost:3000   frontend directly
#   http://localhost:4000   Firebase emulator UI (create/inspect test users and data)
#
# Each backend service adds its own block below (copy the template at the bottom).
# Variables in ${...} can be overridden in a root `.env` file (see .env.example).

name: foc

# Standard environment every Spring Boot service reads (see AGENTS.md "Runtime contract").
x-backend-env: &backend-env
  PORT: "8080"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  FIRESTORE_PROJECT_ID: demo-foc
  FIRESTORE_EMULATOR_HOST: firebase-emulator:8090
  FIREBASE_AUTH_PROJECT_ID: demo-foc
  FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
  USER_SERVICE_MODE: ${USER_SERVICE_MODE:-mock}
  USER_SERVICE_URL: http://user-service:8080
  MOCK_ADMIN_EMAILS: ${MOCK_ADMIN_EMAILS:-admin@u.nus.edu,e1398851@u.nus.edu}
  CORS_ORIGINS: http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080

x-backend-depends: &backend-depends
  firebase-emulator:
    condition: service_healthy

x-order-pubsub-topics: &order-pubsub-topics
  PUBSUB_PROJECT_ID: demo-foc
  ORDER_COMPLETION_TOPIC: order-completion-v1
  ORDER_OPEN_CANCELLATION_TOPIC: open-order-cancellation-v1
  ORDER_ACCEPTED_CANCELLATION_TOPIC: accepted-order-cancellation-v1

services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      frontend:
        condition: service_started
      supplier-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      FOC_ENVIRONMENT: local
      # The browser reaches the frontend on :3000, while APIs are exposed by
      # the host gateway on :8080. Keep this explicit for direct frontend use.
      # Explicit IPv4 avoids broken localhost IPv6 forwarding on Docker Desktop.
      FOC_API_BASE_URL: http://127.0.0.1:8080
      FOC_FIREBASE_PROJECT_ID: demo-foc
      FOC_FIREBASE_API_KEY: demo-api-key
      # Reached by the browser, so this is the host-mapped port.
      FOC_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099

  firebase-emulator:
    build: ./infra/firebase-emulator
    ports:
      - "4000:4000" # emulator UI
      - "9099:9099" # Auth
      - "8090:8090" # Firestore
    volumes:
      - firebase-data:/data
    stop_signal: SIGINT # the Firebase CLI exports data on SIGINT
    stop_grace_period: 30s # time to export data on shutdown

  supplier-service:
    build: ./supplier-service
    ports:
      - "8082:8080"
    environment:
      <<: *backend-env
      FIRESTORE_DATABASE_ID: supplier-local
      # Mounted, not baked into the image (Supplier F2.1.1).
      SUPPLIER_SEED_FILE: /data/supplier-seed-data.csv
    volumes:
      - ./data/csv:/data:ro
    depends_on: *backend-depends
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  credit-service:
    build: ./credit-service
    ports:
      - "8084:8080"
    environment:
      <<: *backend-env
      FIRESTORE_DATABASE_ID: credit-local
    depends_on: *backend-depends
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  user-service:
    build: ./user-service
    ports:
      - "8081:8080"
    environment:
      <<: *backend-env
      # Defaults to the temporary local MongoDB container; override MONGODB_URI
      # when connecting to a peer-provided or managed MongoDB instance.
      MONGODB_URI: ${MONGODB_URI:-mongodb://user-mongodb:27017/userservice}
    depends_on:
      user-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  # Temporary local development dependency for User Service. This does not
  # change User Service code or its managed/staging MongoDB configuration.
  user-mongodb:
    image: mongo:7
    ports:
      # Keep the host port configurable; 27018 avoids colliding with an
      # existing local MongoDB installation while containers still use 27017.
      - "${USER_MONGODB_PORT:-27018}:27017"
    volumes:
      - user-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' --authenticationDatabase admin | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  order-postgres:
    image: postgres:15-alpine
    ports:
      - "${ORDER_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_service}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-order_dev}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev_password}
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USERNAME:-order_dev} -d ${ORDER_DB_NAME:-order_service}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0-emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=demo-foc
      - --host-port=0.0.0.0:8085
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; connection = socket.create_connection(("127.0.0.1", 8085), 2); connection.close()
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  pubsub-topics-init:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0-emulators
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for topic_id in "$${ORDER_COMPLETION_TOPIC}" "$${ORDER_OPEN_CANCELLATION_TOPIC}" "$${ORDER_ACCEPTED_CANCELLATION_TOPIC}"; do
          topic_url="http://pubsub-emulator:8085/v1/projects/$${PUBSUB_PROJECT_ID}/topics/$${topic_id}"
          topic_body="{\"name\":\"projects/$${PUBSUB_PROJECT_ID}/topics/$${topic_id}\"}"
          response_code="$$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request PUT --header "Content-Type: application/json" --data "$${topic_body}" "$${topic_url}")"
          if [[ "$${response_code}" == "200" || "$${response_code}" == "201" ]]; then
            echo "Created Pub/Sub emulator topic $${topic_id}."
          elif [[ "$${response_code}" == "409" ]] && curl --fail --silent --show-error --request GET "$${topic_url}" > /dev/null; then
            echo "Pub/Sub emulator topic $${topic_id} already exists."
          else
            echo "Could not initialize Pub/Sub emulator topic $${topic_id}; HTTP $${response_code}." >&2
            exit 1
          fi
        done
    environment: *order-pubsub-topics
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    restart: "no"

  order-service:
    build: ./order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8080"
    environment:
      <<: [*backend-env, *order-pubsub-topics]
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/${ORDER_DB_NAME:-order_service}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USERNAME:-order_dev}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev_password}
      SPRING_FLYWAY_ENABLED: "true"
      ORDER_PEERS_MODE: mock
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      ORDER_LIFECYCLE_TOKEN: ${ORDER_LIFECYCLE_TOKEN:-local-lifecycle}
    depends_on:
      <<: *backend-depends
      order-postgres:
        condition: service_healthy
      pubsub-topics-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  # ---- Backend service template ------------------------------------------
  # Copy, uncomment and rename once <name>-service has a working Dockerfile.
  # admin-service is currently an empty placeholder, so it is intentionally not built here.
  # Host ports: user 8081, supplier 8082, order 8083, credit 8084, admin 8085.
  #
  # <name>-service:
  #   build: ./<name>-service
  #   ports:
  #     - "808X:8080"
  #   environment:
  #     <<: *backend-env
  #     FIRESTORE_DATABASE_ID: <name>-local
  #   depends_on: *backend-depends

volumes:
  firebase-data:
  order-postgres-data:
  user-mongodb-data:
