# AI Assistance Disclosure:
# Tool: OpenAI Codex (GPT-6), date: 2026-10-07
# Scope: Replaced Order Service's default Pub/Sub emulator with real Pub/Sub dev topics and a private local ADC mount.
# Author review: User/team must configure GCP topics and topic-scoped IAM before running.

# FoC local deployment (M7). Start everything with:   docker compose up --build
#
#   http://localhost:8080   gateway: UI + all APIs (use this one)
#   http://localhost:3000   frontend directly
#   http://localhost:4000   Firebase emulator UI (create/inspect test users and data)
#
# Each backend service adds its own block below (copy the template at the bottom).
# Variables in ${...} can be overridden in a root `.env` file (see .env.example).

name: foc

# Standard environment every Spring Boot service reads (see AGENTS.md "Runtime contract").
x-backend-env: &backend-env
  PORT: "8080"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  FIREBASE_AUTH_PROJECT_ID: demo-foc
  FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
  USER_SERVICE_MODE: ${USER_SERVICE_MODE:-mock}
  USER_SERVICE_URL: http://user-service:8080
  MOCK_ADMIN_EMAILS: ${MOCK_ADMIN_EMAILS:-admin@u.nus.edu,e1398851@u.nus.edu}
  CORS_ORIGINS: http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080

x-firestore-env: &firestore-env
  FIRESTORE_PROJECT_ID: demo-foc
  FIRESTORE_EMULATOR_HOST: firebase-emulator:8090

x-backend-depends: &backend-depends
  firebase-emulator:
    condition: service_healthy

x-order-pubsub-topics: &order-pubsub-topics
  PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-protean-vigil-509704-q4}
  ORDER_COMPLETION_TOPIC: ${ORDER_COMPLETION_TOPIC:-order-completion-dev-v1}
  ORDER_OPEN_REFUND_TOPIC: ${ORDER_OPEN_REFUND_TOPIC:-open-order-refund-dev-v1}
  ORDER_ACCEPTED_CANCELLATION_TOPIC: ${ORDER_ACCEPTED_CANCELLATION_TOPIC:-accepted-order-cancellation-dev-v1}

services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      frontend:
        condition: service_started
      supplier-service:
        condition: service_healthy
      credit-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      FOC_ENVIRONMENT: local
      # The browser reaches the frontend on :3000, while APIs are exposed by
      # the host gateway on :8080. Keep this explicit for direct frontend use.
      # Explicit IPv4 avoids broken localhost IPv6 forwarding on Docker Desktop.
      FOC_API_BASE_URL: http://127.0.0.1:8080
      FOC_FIREBASE_PROJECT_ID: demo-foc
      FOC_FIREBASE_API_KEY: demo-api-key
      # Reached by the browser, so this is the host-mapped port.
      FOC_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099

  firebase-emulator:
    build: ./infra/firebase-emulator
    ports:
      - "4000:4000" # emulator UI
      - "9099:9099" # Auth
      - "8090:8090" # Firestore
    volumes:
      - firebase-data:/data
    stop_signal: SIGINT # the Firebase CLI exports data on SIGINT
    stop_grace_period: 30s # time to export data on shutdown

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  supplier-service:
    build: ./supplier-service
    ports:
      - "8082:8080"
    environment:
      <<: [*backend-env, *firestore-env]
      FIRESTORE_DATABASE_ID: supplier-local
      # Mounted, not baked into the image (Supplier F2.1.1).
      SUPPLIER_SEED_FILE: /data/supplier-seed-data.csv
    volumes:
      - ./data/csv:/data:ro
    depends_on: *backend-depends
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  credit-service:
    build: ./credit-service
    ports:
      - "8084:8080"
    environment:
      <<: *backend-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://credit-postgres:5432/${CREDIT_DB_NAME:-credit_service}
      SPRING_DATASOURCE_USERNAME: ${CREDIT_DB_USERNAME:-credit_dev}
      SPRING_DATASOURCE_PASSWORD: ${CREDIT_DB_PASSWORD:-credit_dev_password}
      SPRING_FLYWAY_ENABLED: "true"
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-protean-vigil-509704-q4}
      CREDIT_PUBSUB_PUSH_AUDIENCE: http://credit-service:8080
      CREDIT_PUBSUB_PUSH_SERVICE_ACCOUNT: foc-credit-push-local@demo-foc.iam.gserviceaccount.com
      CREDIT_ORDER_COMPLETION_SUBSCRIPTION: ${CREDIT_ORDER_COMPLETION_SUBSCRIPTION:-credit-order-completion-dev-v1}
      CREDIT_ORDER_OPEN_REFUND_SUBSCRIPTION: ${CREDIT_ORDER_OPEN_REFUND_SUBSCRIPTION:-credit-open-order-refund-dev-v1}
    depends_on:
      <<: *backend-depends
      credit-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  credit-postgres:
    image: postgres:15-alpine
    ports:
      - "${CREDIT_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${CREDIT_DB_NAME:-credit_service}
      POSTGRES_USER: ${CREDIT_DB_USERNAME:-credit_dev}
      POSTGRES_PASSWORD: ${CREDIT_DB_PASSWORD:-credit_dev_password}
    volumes:
      - credit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CREDIT_DB_USERNAME:-credit_dev} -d ${CREDIT_DB_NAME:-credit_service}"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-service:
    build: ./user-service
    ports:
      - "8081:8080"
    environment:
      <<: *backend-env
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/UserServiceDB}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  order-postgres:
    image: postgres:15-alpine
    ports:
      - "${ORDER_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME:-order_service}
      POSTGRES_USER: ${ORDER_DB_USERNAME:-order_dev}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev_password}
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USERNAME:-order_dev} -d ${ORDER_DB_NAME:-order_service}"]
      interval: 5s
      timeout: 5s
      retries: 12

  order-service:
    build: ./order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8080"
    environment:
      <<: [*backend-env, *order-pubsub-topics]
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/${ORDER_DB_NAME:-order_service}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USERNAME:-order_dev}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:-order_dev_password}
      SPRING_FLYWAY_ENABLED: "true"
      ORDER_PEERS_MODE: mock
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/application_default_credentials.json
      ORDER_LIFECYCLE_TOKEN: ${ORDER_LIFECYCLE_TOKEN:-local-lifecycle}
      ORDER_LIFECYCLE_CRON: ${ORDER_LIFECYCLE_CRON:-0 * * * * *}
      ORDER_OUTBOX_RECOVERY_CRON: ${ORDER_OUTBOX_RECOVERY_CRON:-0 */15 * * * *}
    volumes:
      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST:?Set GOOGLE_APPLICATION_CREDENTIALS_HOST to your local ADC credentials file}
        target: /var/run/secrets/google/application_default_credentials.json
        read_only: true
    depends_on:
      <<: *backend-depends
      order-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  # ---- Backend service template ------------------------------------------
  # Copy, uncomment and rename once <name>-service has a working Dockerfile.
  # admin-service is currently an empty placeholder, so it is intentionally not built here.
  # Host ports: user 8081, supplier 8082, order 8083, credit 8084, admin 8085.
  #
  # <name>-service:
  #   build: ./<name>-service
  #   ports:
  #     - "808X:8080"
  #   environment:
  #     <<: *backend-env
  #     FIRESTORE_DATABASE_ID: <name>-local
  #   depends_on: *backend-depends

volumes:
  firebase-data:
  mongodb-data:
  order-postgres-data:
  credit-postgres-data:
